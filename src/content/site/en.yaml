passions:
    title: Passions
    items:
        - icon: mountain
          text: The mountains and forests are my refuge, places where I can find ==balance between nature and freedom==. I love experiencing the mountains in every possible way, from trekking to mountain biking, from skiing to climbing. I adore snow, fog, and cold climates; and what I miss the most, living in Sweden, are the Alps.
        - icon: dice
          text: I have also been passionate about video games and role-playing games, both digital and tabletop, since I was a child. I believe they help ==stimulate creativity==, critical thinking, and teamwork. I enjoy TV series, cinema, and nerd culture in general.
        - icon: globe
          text: I’m a ==passionate traveler== drawn to both the Far East and the Far North — fascinated by Japan’s culture and philosophy as well as Scandinavia’s minimalism, nature, and innovation. Traveling helps me grow, learn, and experience the world through different lenses.

