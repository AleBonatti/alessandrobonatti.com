experience:
    title: Esperienza
    jobs:
        - years: 2025 — 2026
          company: Elva11
          role: Full stack developer
          location: Malmö, Svezia
          description: Lavoro come ==consulente== su diversi incarichi per clienti, contribuendo a progetti di sviluppo web full stack e adattandomi a tecnologie, team ed esigenze di business differenti.
        - years: 2023 — 2025
          company: e-Project
          role: Full stack developer
          location: Parma, Italia
          description: Stanco della dura vita da freelance in Italia, ho deciso di tornare alla ==programmazione a tempo pieno==. Le nuove possibilità offerte dall’AI sono diventate il mio interesse principale.
        - years: 2011 — 2023
          company: Methlab
          role: Socio e co-fondatore
          location: Fidenza, Italia
          description: Ho co-fondato e gestito ==la mia agenzia di sviluppo web==, occupandomi della progettazione, dello sviluppo e della gestione di siti e applicazioni. Mi sono specializzato come Full Stack Developer, seguendo sia lo sviluppo frontend che quello backend.
        - years: 2001 — 2011
          company: e-Project
          role: Full stack developer
          location: Parma, Italia
          description: Ho iniziato sviluppando semplici siti web per passare gradualmente a progetti più complessi, tra cui gestionali e piattaforme e-commerce. Mi sono concentrato sulla creazione di interfacce intuitive e ==funzionalità avanzate==, lavorando a progetti in settori diversi e migliorando costantemente le mie competenze tecniche.
        - years: 1999 — 2001
          company: FirstPoint
          role: Web developer
          location: Fidenza, Italia
          description: Il mio primo lavoro nello sviluppo web, dove ho realizzato e mantenuto siti web concentrandomi su HTML, CSS e JavaScript. Ho collaborato con designer e altri sviluppatori per offrire ==soluzioni efficaci e funzionali==, adattandomi alle esigenze dei clienti.

