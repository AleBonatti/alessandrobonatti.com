education:
    title: Formazione
    items:
        - years: 1996 — 1999
          title: Studi universitari in Scienze della Comunicazione
          detail: Non completati — Università di Parma
          location: Parma, Italia
          description: La passione per quella incredibile nuova invenzione chiamata "Internet" mi ha spinto a ==esplorare lo sviluppo web da autodidatta==. Affascinato dalle sue potenzialità, ho iniziato a studiare in autonomia, gettando le basi per la mia futura carriera nel settore.
        - years: 1991 — 1996
          title: Istituto Tecnico Industriale ad indirizzo Informatico
          detail: Diploma con 51/60 — I.T.I.S. Berenini
          location: Fidenza, Italia
          description: In questo periodo ho imparato i fondamenti della programmazione, in un’epoca in cui internet non era ancora diffuso. Questa esperienza mi ha dato una solida ==base nel problem solving== e nel pensiero algoritmico, che ho poi applicato allo sviluppo web.
    note:
        title: "Sviluppo web da autodidatta:"
        text: all’inizio degli anni 2000 lo sviluppo web non faceva ancora parte dei programmi scolastici. Per questo ho intrapreso un percorso di autoformazione, studiando in autonomia tecnologie e linguaggi di programmazione per restare al passo con l’evoluzione del settore.

passions:
    title: Passioni
    items:
        - icon: mountain
          text: Le montagne e i boschi sono il mio rifugio, luoghi in cui trovo ==equilibrio tra natura e libertà==. Amo vivere la montagna in ogni modo possibile, dal trekking alla mountain bike, dallo sci all’arrampicata. Adoro la neve, la nebbia e i climi freddi; e ciò che mi manca di più, vivendo in Svezia, sono le Alpi.
        - icon: dice
          text: Fin da bambino sono appassionato di videogiochi e giochi di ruolo, sia digitali che da tavolo. Credo che aiutino a ==stimolare la creatività==, il pensiero critico e il lavoro di squadra. Mi piacciono le serie TV, il cinema e la cultura nerd in generale.
        - icon: globe
          text: Sono un ==viaggiatore appassionato==, attratto sia dall’Estremo Oriente che dal Grande Nord — affascinato dalla cultura e dalla filosofia del Giappone così come dal minimalismo, dalla natura e dall’innovazione della Scandinavia. Viaggiare mi aiuta a crescere, a imparare e a vedere il mondo da prospettive diverse.

