          description: Nel tempo mi sono appassionato ai framework e alle tecnologie di sviluppo moderne, e oggi il mio focus principale è su ==**Typescript** e **Node.js**==, con ==Fastify== per lo sviluppo backend. Ho inoltre una lunga esperienza con l’==ecosistema PHP/Laravel==, che per diversi anni è stato una parte importante del mio percorso professionale.
