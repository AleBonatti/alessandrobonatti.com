about:
    title: Chi sono
    lead: Hej, sono Alessandro,
    statement: un Full Stack Web Developer con ==oltre 25 anni di esperienza== nel settore.
    paragraphs:
        - Ho iniziato la mia carriera nel 1999 come dipendente, ruolo che ho ricoperto per 13 anni, prima di passare alla libera professione e fondare una mia agenzia, che ho gestito con successo per altri 13 anni.
        - In questo percorso ho maturato una ==solida esperienza nello sviluppo web==, lavorando con tecnologie diverse e affrontando progetti di complessità variabile. Le mie competenze spaziano dal front end al back end, con una ==forte attenzione alla creazione di soluzioni scalabili, manutenibili e performanti==.
        - Da quando mi sono trasferito a Malmö, in Svezia, nell’ottobre 2025, lavoro come ==consulente nello sviluppo software==, maturando un’esperienza preziosa all’interno dell’ambiente professionale svedese.

skills:
