          tags: HTML · CSS · VUEJS
          title: Web Frontend
          description: Negli ultimi anni ho cercato di colmare il più possibile le lacune che mi separavano dall’essere uno sviluppatore completo e indipendente, approfondendo lo sviluppo Frontend e Typescript, in particolare i ==framework Vue.js e React insieme a Tailwind CSS==. Ho esperienza anche con le tematiche legate alla SEO, all’usabilità e all’accessibilità.
          tiles:
              - { name: React, icon: react }
