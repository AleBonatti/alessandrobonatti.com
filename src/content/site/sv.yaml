education:
  title: Utbildning
  items:
    - years: 1996 — 1999
      title: Universitetsstudier i kommunikationsvetenskap
      detail: Ej avslutade — Università di Parma
      location: Parma, Italien
      description: Min passion för den otroliga nya uppfinningen som kallades "internet" fick mig att ==utforska webbutveckling på egen hand==. Fascinerad av dess möjligheter började jag lära mig självständigt och lade grunden för min framtida karriär inom området.
    - years: 1991 — 1996
      title: Tekniskt gymnasium med inriktning på datavetenskap
      detail: Examen med betyg 51/60 — I.T.I.S. Berenini
      location: Fidenza, Italien
      description: Under den här perioden lärde jag mig grunderna i programmering, i en tid då internet ännu inte var utbrett. Den erfarenheten gav mig en stark ==grund i problemlösning== och algoritmiskt tänkande, som jag senare har tillämpat inom webbutveckling.
  note:
    title: "Självlärd webbutvecklare:"
    text: i början av 2000-talet ingick webbutveckling ännu inte i skolornas läroplaner. Därför gav jag mig in på en resa av självstudier och lärde mig tekniker och programmeringsspråk på egen hand för att hänga med i branschens utveckling.

passions:
  title: Passioner
  items:
    - icon: mountain
      text: Bergen och skogarna är min tillflykt, platser där jag hittar ==balansen mellan natur och frihet==. Jag älskar att uppleva bergen på alla sätt, från vandring till mountainbike, från skidåkning till klättring. Jag älskar snö, dimma och kallt klimat; och det jag saknar mest här i Sverige är Alperna.
    - icon: dice
      text: Sedan barndomen har jag också varit passionerad för datorspel och rollspel, både digitala och bordsrollspel. Jag tror att de hjälper till att ==stimulera kreativiteten==, det kritiska tänkandet och samarbetsförmågan. Jag gillar tv-serier, film och nördkultur i allmänhet.
    - icon: globe
      text: Jag är en ==passionerad resenär== som dras till både Fjärran Östern och Höga Norden — fascinerad av Japans kultur och filosofi lika mycket som av Skandinaviens minimalism, natur och innovation. Att resa hjälper mig att växa, lära mig och uppleva världen ur olika perspektiv.

tidbits:
  title: Smått och gott
  statement: Född den _17/01/1976_ är jag en självständig person med många års erfarenhet och en stark vilja att ständigt utmana mig själv. Jag tar mig an varje ny utmaning med entusiasm och lust att utvecklas, alltid öppen för nya möjligheter att lära och bli bättre.
  paragraphs:
    - Jag har **körkort för både bil och motorcykel** och är van vid att klara mig självständigt och anpassa mig till olika miljöer. Sedan flytten till Sverige har jag gett mig in på nya professionella och personliga äventyr, och jag tar med mig mitt **initiativ, min pålitlighet och mitt engagemang** för att aktivt bidra till nya projekt.
    - Jag inleder detta spännande nya kapitel i livet tillsammans med min partner — både i kärlek och i arbete — Carmen.

