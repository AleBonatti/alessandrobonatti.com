passions:
    title: Passioner
    items:
        - icon: mountain
          text: Bergen och skogarna är min tillflykt, platser där jag hittar ==balansen mellan natur och frihet==. Jag älskar att uppleva bergen på alla sätt, från vandring till mountainbike, från skidåkning till klättring. Jag älskar snö, dimma och kallt klimat; och det jag saknar mest här i Sverige är Alperna.
        - icon: dice
          text: Sedan barndomen har jag också varit passionerad för datorspel och rollspel, både digitala och bordsrollspel. Jag tror att de hjälper till att ==stimulera kreativiteten==, det kritiska tänkandet och samarbetsförmågan. Jag gillar tv-serier, film och nördkultur i allmänhet.
        - icon: globe
          text: Jag är en ==passionerad resenär== som dras till både Fjärran Östern och Höga Norden — fascinerad av Japans kultur och filosofi lika mycket som av Skandinaviens minimalism, natur och innovation. Att resa hjälper mig att växa, lära mig och uppleva världen ur olika perspektiv.

