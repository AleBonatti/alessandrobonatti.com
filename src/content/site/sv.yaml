about:
  title: Om mig
  lead: Hej, jag heter Alessandro,
  statement: en fullstackutvecklare med ==över 25 års erfarenhet== inom branschen.
  paragraphs:
    - Jag började min karriär 1999 som anställd, en roll jag hade i 13 år, innan jag gick över till att frilansa och grundade min egen byrå, som jag framgångsrikt drev i ytterligare 13 år.
    - Under den här resan har jag fått ==bred erfarenhet av webbutveckling==, arbetat med många olika tekniker och tagit mig an projekt av varierande komplexitet. Min kompetens sträcker sig från frontend till backend, med ==starkt fokus på skalbara, underhållbara och högpresterande lösningar==.
    - Sedan jag flyttade till Malmö i oktober 2025 arbetar jag som ==konsult inom mjukvaruutveckling== och har fått värdefull erfarenhet av den svenska arbetsmiljön.

